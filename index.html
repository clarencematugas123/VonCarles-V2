<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>VonCarles Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(79, 70, 229, .2), transparent 42%),
        radial-gradient(ellipse at 90% 90%, rgba(14, 165, 233, .13), transparent 40%),
        #0b1020;
    }

    .calculator {
      width: min(100%, 360px);
      padding: 24px;
      border: 1px solid rgba(148, 163, 184, .16);
      border-radius: 28px;
      background: rgba(17, 24, 39, .92);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .45);
    }

    .heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: .02em;
    }

    .badge {
      padding: 5px 9px;
      border: 1px solid rgba(129, 140, 248, .3);
      border-radius: 999px;
      color: #a5b4fc;
      font-size: .7rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .screen {
      min-height: 118px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      overflow: hidden;
      margin-bottom: 20px;
      padding: 15px 4px;
      text-align: right;
    }

    .previous {
      min-height: 1.4em;
      color: #94a3b8;
      font-size: .95rem;
    }

    .display {
      width: 100%;
      overflow: hidden;
      color: #f8fafc;
      font-size: clamp(2.4rem, 12vw, 3.5rem);
      font-variant-numeric: tabular-nums;
      font-weight: 300;
      letter-spacing: -.055em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 11px;
    }

    button {
      min-width: 0;
      aspect-ratio: 1.12;
      border: 1px solid transparent;
      border-radius: 17px;
      background: #202a3c;
      color: #e2e8f0;
      cursor: pointer;
      font: inherit;
      font-size: 1.15rem;
      transition: background .15s ease, transform .15s ease, border-color .15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: #2b3850; }
    button:active { transform: scale(.95); }
    button:focus-visible { outline: 2px solid #a5b4fc; outline-offset: 2px; }

    .utility {
      background: #30394b;
      color: #cbd5e1;
    }

    .operator {
      background: rgba(99, 102, 241, .16);
      color: #a5b4fc;
      font-size: 1.35rem;
    }

    .operator:hover { background: rgba(99, 102, 241, .28); }

    .equals {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      font-size: 1.4rem;
      box-shadow: 0 8px 20px rgba(79, 70, 229, .25);
    }

    .equals:hover { background: linear-gradient(135deg, #818cf8, #6366f1); }

    .zero {
      grid-column: span 2;
      aspect-ratio: auto;
    }

    .hint {
      margin: 18px 0 0;
      color: #64748b;
      font-size: .75rem;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <header class="heading">
      <h1>VonCarles</h1>
      <span class="badge">Calculator</span>
    </header>

    <section class="screen" aria-live="polite" aria-atomic="true" aria-label="Calculation display">
      <div class="previous" id="previous"></div>
      <div class="display" id="display">0</div>
    </section>

    <div class="keys" aria-label="Calculator keys">
      <button class="utility" type="button" data-action="clear" aria-label="All clear">AC</button>
      <button class="utility" type="button" data-action="sign" aria-label="Change sign">+/−</button>
      <button class="utility" type="button" data-action="percent" aria-label="Percent">%</button>
      <button class="operator" type="button" data-operator="/" aria-label="Divide">÷</button>

      <button type="button" data-digit="7">7</button>
      <button type="button" data-digit="8">8</button>
      <button type="button" data-digit="9">9</button>
      <button class="operator" type="button" data-operator="*" aria-label="Multiply">×</button>

      <button type="button" data-digit="4">4</button>
      <button type="button" data-digit="5">5</button>
      <button type="button" data-digit="6">6</button>
      <button class="operator" type="button" data-operator="-" aria-label="Subtract">−</button>

      <button type="button" data-digit="1">1</button>
      <button type="button" data-digit="2">2</button>
      <button type="button" data-digit="3">3</button>
      <button class="operator" type="button" data-operator="+" aria-label="Add">+</button>

      <button class="zero" type="button" data-digit="0">0</button>
      <button type="button" data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" type="button" data-action="equals" aria-label="Equals">=</button>
    </div>
    <p class="hint">You can also use your keyboard</p>
  </main>

  <script>
    const display = document.querySelector("#display");
    const previous = document.querySelector("#previous");
    let current = "0";
    let stored = null;
    let pendingOperator = null;
    let replaceCurrent = false;

    function render() {
      display.textContent = current;
    }

    function inputDigit(digit) {
      if (replaceCurrent || current === "Error") {
        current = digit;
        replaceCurrent = false;
      } else if (current === "0") {
        current = digit;
      } else if (current.replace("-", "").replace(".", "").length < 15) {
        current += digit;
      }
      render();
    }

    function inputDecimal() {
      if (replaceCurrent || current === "Error") {
        current = "0.";
        replaceCurrent = false;
      } else if (!current.includes(".")) {
        current += ".";
      }
      render();
    }

    function formatResult(value) {
      if (!Number.isFinite(value)) return "Error";
      return String(Number.parseFloat(value.toPrecision(12)));
    }

    function calculate(left, right, operator) {
      switch (operator) {
        case "+": return left + right;
        case "-": return left - right;
        case "*": return left * right;
        case "/": return right === 0 ? NaN : left / right;
        default: return right;
      }
    }

    function chooseOperator(operator) {
      const value = Number(current);
      if (pendingOperator && !replaceCurrent) {
        current = formatResult(calculate(stored, value, pendingOperator));
        render();
        if (current === "Error") {
          stored = null;
          pendingOperator = null;
          previous.textContent = "";
          replaceCurrent = true;
          return;
        }
      } else {
        current = formatResult(value);
      }
      stored = Number(current);
      pendingOperator = operator;
      previous.textContent = `${current} ${operator}`;
      replaceCurrent = true;
    }

    function equals() {
      if (!pendingOperator || stored === null || replaceCurrent) return;
      const expression = `${formatResult(stored)} ${pendingOperator} ${current} =`;
      current = formatResult(calculate(stored, Number(current), pendingOperator));
      previous.textContent = expression;
      stored = null;
      pendingOperator = null;
      replaceCurrent = true;
      render();
    }

    function clear() {
      current = "0";
      stored = null;
      pendingOperator = null;
      replaceCurrent = false;
      previous.textContent = "";
      render();
    }

    function performAction(action) {
      switch (action) {
        case "clear": clear(); break;
        case "decimal": inputDecimal(); break;
        case "equals": equals(); break;
        case "sign":
          if (current !== "0" && current !== "Error") current = current.startsWith("-") ? current.slice(1) : `-${current}`;
          render();
          break;
        case "percent":
          if (current !== "Error") current = formatResult(Number(current) / 100);
          render();
          break;
        case "backspace":
          if (!replaceCurrent && current !== "Error") current = current.length > 1 ? current.slice(0, -1) : "0";
          render();
          break;
      }
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.digit !== undefined) inputDigit(button.dataset.digit);
      else if (button.dataset.operator) chooseOperator(button.dataset.operator);
      else performAction(button.dataset.action);
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9]$/.test(event.key)) inputDigit(event.key);
      else if (event.key === ".") inputDecimal();
      else if (["+", "-", "*", "/"].includes(event.key)) chooseOperator(event.key);
      else if (event.key === "Enter" || event.key === "=") performAction("equals");
      else if (event.key === "Escape") performAction("clear");
      else if (event.key === "Backspace") performAction("backspace");
      else if (event.key === "%") performAction("percent");
      else return;
      event.preventDefault();
    });
  </script>
</body>
</html>
